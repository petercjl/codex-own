name: Publish codex-own npm
on:
  workflow_dispatch:
    inputs:
      release: {description: 'patch, minor, major or exact semver', type: string, default: patch, required: true}
      tag: {description: 'npm dist-tag', type: choice, options: [latest, next], default: latest, required: true}
      mode: {description: 'Automatic component plan; manager-only refuses unproven reuse', type: choice, options: [auto, manager-only, native, runtime], default: auto, required: true}
      verified_run: {description: 'Publication recovery only: passed QA run with unchanged component inputs', type: string, default: ''}
      verify_only: {description: 'Run the planned platform gates without publishing or changing installed apps', type: boolean, default: false}
permissions:
  contents: read
concurrency:
  group: codex-own-npm-publish
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'petercjl/codex-own' && github.ref == 'refs/heads/own-main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      native: ${{ steps.plan.outputs.native }}
      runtime: ${{ steps.plan.outputs.runtime }}
      kind: ${{ steps.plan.outputs.kind }}
      base_version: ${{ steps.plan.outputs.base_version }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '24.15.0', package-manager-cache: false}
      - id: version
        env: {RELEASE: '${{ inputs.release }}'}
        run: |
          echo "version=$(node own/ci/version.mjs "$RELEASE")" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Prove immutable component reuse and classify complete inputs
        env: {GH_TOKEN: '${{ github.token }}', OWN_VERSION: '${{ steps.version.outputs.version }}', RELEASE_MODE: '${{ inputs.mode }}'}
        run: node own/ci/release-plan.mjs . "$OWN_VERSION" release-plan.json "$RELEASE_MODE"
      - uses: actions/upload-artifact@v7
        with: {name: release-plan, path: release-plan.json, retention-days: 3}
  manager-qa:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: darwin-arm64}
          - {os: windows-latest, platform: win32-x64}
    runs-on: ${{ matrix.os }}
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ needs.prepare.outputs.ref }}', fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '24.15.0', package-manager-cache: false}
      - uses: actions/download-artifact@v7
        with: {name: release-plan}
      - run: npm ci --prefix own
      - run: npm run check --prefix own && npm test --prefix own
      - name: Packed manager installation and pinned native invocation
        run: node own/ci/manager-qa.mjs release-plan.json own/artifacts/current.json
  native:
    if: needs.prepare.outputs.native == 'true' && inputs.verified_run == ''
    needs: prepare
    permissions: {contents: write}
    uses: ./.github/workflows/own-build.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      existing: ${{ needs.prepare.outputs.base_version != '' }}
      base_version: ${{ needs.prepare.outputs.base_version }}
      runtime_qa: false
  runtimes:
    if: needs.prepare.outputs.runtime == 'true' && inputs.verified_run == ''
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: darwin-arm64}
          - {os: windows-latest, platform: win32-x64}
    runs-on: ${{ matrix.os }}
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ needs.prepare.outputs.ref }}'}
      - uses: actions/setup-node@v6
        with: {node-version: '24.15.0', package-manager-cache: false}
      - run: npm ci --prefix own
      - name: Verify independent Node npm Python on target OS
        run: |
          mkdir -p out/tools
          node own/ci/prepare-runtimes.mjs out/tools "${{ matrix.platform }}" own/artifacts/current.json
          node own/ci/test-runtimes.mjs out/tools
      - name: Record source-pinned runtime QA proof
        run: node own/ci/qa-proof.mjs "${{ matrix.platform }}" "qa-proof-${{ matrix.platform }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-proof-${{ matrix.platform }}
          path: qa-proof-${{ matrix.platform }}.json
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: tools-${{ matrix.platform }}
          path: out/tools/publish/*
          retention-days: 3
          if-no-files-found: error
  recover-qa:
    if: inputs.verified_run != ''
    needs: prepare
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read}
    outputs:
      source_ref: ${{ steps.proof.outputs.source_ref }}
      source_run: ${{ steps.proof.outputs.source_run }}
      source_workflow: ${{ steps.proof.outputs.source_workflow }}
      trigger_ref: ${{ steps.proof.outputs.trigger_ref }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ needs.prepare.outputs.ref }}', fetch-depth: 0}
      - uses: actions/download-artifact@v7
        with: {name: release-plan}
      - uses: actions/setup-node@v6
        with: {node-version: '24.15.0', package-manager-cache: false}
      - name: Verify publication recovery source and component QA
        id: proof
        env: {GH_TOKEN: '${{ github.token }}', VERIFIED_RUN: '${{ inputs.verified_run }}'}
        run: node own/ci/verify-qa-reuse.mjs "$VERIFIED_RUN" release-plan.json
  publish:
    if: >-
      ${{ !cancelled() && !inputs.verify_only && needs.prepare.result == 'success' && needs.manager-qa.result == 'success' &&
      ((inputs.verified_run != '' && needs.recover-qa.result == 'success') ||
      (inputs.verified_run == '' && (needs.native.result == 'success' || needs.prepare.outputs.native == 'false') &&
      (needs.runtimes.result == 'success' || needs.prepare.outputs.runtime == 'false'))) }}
    needs: [prepare, manager-qa, native, runtimes, recover-qa]
    runs-on: ubuntu-latest
    permissions: {contents: write, id-token: write, actions: read}
    steps:
      - uses: actions/checkout@v6
        with: {ref: own-main, fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '24.15.0', registry-url: 'https://registry.npmjs.org', package-manager-cache: false}
      - run: npm install --global npm@12.2.0
      - run: npm ci --prefix own
      - uses: actions/download-artifact@v7
        with: {name: release-plan}
      - uses: actions/download-artifact@v7
        if: needs.prepare.outputs.native == 'true' || needs.prepare.outputs.runtime == 'true'
        with:
          path: out/verified
          run-id: ${{ inputs.verified_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Finalize changed components without rebuilding verified candidates
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_REF: ${{ needs.prepare.outputs.ref }}
          BUILD_NATIVE: ${{ needs.prepare.outputs.native }}
          BUILD_RUNTIME: ${{ needs.prepare.outputs.runtime }}
          ARTIFACT_SOURCE_REF: ${{ needs.recover-qa.outputs.source_ref }}
          ARTIFACT_SOURCE_RUN: ${{ needs.recover-qa.outputs.source_run }}
          ARTIFACT_SOURCE_WORKFLOW: ${{ needs.recover-qa.outputs.source_workflow }}
          ARTIFACT_TRIGGER_REF: ${{ needs.recover-qa.outputs.trigger_ref }}
          VERIFIED_RUN: ${{ inputs.verified_run || github.run_id }}
          npm_config_logs_dir: ${{ runner.temp }}/own-npm-publish
          npm_config_logs_max: '1000'
          npm_config_fetch_timeout: '60000'
          npm_config_fetch_retries: '2'
          npm_config_fetch_retry_mintimeout: '10000'
          npm_config_fetch_retry_maxtimeout: '30000'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REF"
          mkdir -p out/verified
          test ! -e out/own-npm-diagnostics.cjs
          test ! -e out/npm-upload-failed.json
          cat > out/own-npm-diagnostics.cjs <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const root = process.env.npm_config_logs_dir, seen = new Map();
          fs.mkdirSync(root, {recursive:true});
          function inspect() {
            for (const name of fs.readdirSync(root).filter(n => n.endsWith('.log'))) {
              const file = path.join(root, name);
              let lines; try { lines = fs.readFileSync(file, 'utf8').split('\n'); } catch { continue; }
              const prior = seen.get(name) || 0;
              for (const line of lines.slice(prior).filter(l => /\berror\b/i.test(l))) {
                const safe = line.replace(/https?:\/\/\S+/g, '[URL]')
                  .replace(/\b(?:npm_|ghp_|gho_|github_pat_)[A-Za-z0-9_]+/g, '[REDACTED]')
                  .replace(/\beyJ[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+){2}/g, '[REDACTED]')
                  .replace(/Bearer\s+\S+/ig, 'Bearer [REDACTED]')
                  .replace(/\b(?:token|password|_authToken)\s*[:=]\s*\S+/ig, '[REDACTED]')
                  .replace(/sk-[A-Za-z0-9_-]+/g, '[REDACTED]').slice(0, 1200);
                console.log(JSON.stringify({npmPublishDiagnostic:{file:name,line:safe}}));
                const code = line.match(/\berror code\s+(E[A-Z0-9_]+)/)?.[1];
                if (code && code !== 'EPUBLISHCONFLICT' && !fs.existsSync('out/npm-upload-failed.json')) {
                  fs.writeFileSync('out/npm-upload-failed.json', JSON.stringify({code,file:name,diagnostic:safe}), {flag:'wx',mode:0o600});
                }
              }
              seen.set(name, Math.max(0, lines.length - 1));
            }
          }
          inspect(); setInterval(inspect, 5000);
          NODE
          node out/own-npm-diagnostics.cjs &
          own_log_pid=$!
          trap 'kill "$own_log_pid" 2>/dev/null || true' EXIT
          if [ "$BUILD_NATIVE" = true ] || [ "$BUILD_RUNTIME" = true ]; then node own/ci/verify-qa-reuse.mjs "$VERIFIED_RUN" release-plan.json; fi
          if [ "$BUILD_NATIVE" = true ]; then node own/ci/combine.mjs out/verified "$OWN_VERSION"; else cp own/artifacts/current.json out/catalog-input.json; node -e "const fs=require('fs');fs.writeFileSync('out/verified/manifest.json',JSON.stringify(JSON.parse(fs.readFileSync('out/catalog-input.json')).manifest))"; fi
          if [ "$BUILD_RUNTIME" = true ]; then node own/ci/combine-tools.mjs out/verified; else node -e "const fs=require('fs');const p='out/verified/manifest.json',m=JSON.parse(fs.readFileSync(p));m.runtimes=JSON.parse(fs.readFileSync('own/artifacts/current.json')).manifest.runtimes;fs.writeFileSync(p,JSON.stringify(m))"; fi
          if [ "$BUILD_NATIVE" = true ] || [ "$BUILD_RUNTIME" = true ]; then
            node own/ci/publish-npm-assets.mjs out/verified &
            own_publish_pid=$!
            while kill -0 "$own_publish_pid" 2>/dev/null; do
              if test -f out/npm-upload-failed.json; then
                kill "$own_publish_pid" 2>/dev/null || true
                wait "$own_publish_pid" 2>/dev/null || true
                cat out/npm-upload-failed.json
                exit 1
              fi
              sleep 5
            done
            wait "$own_publish_pid"
            node own/ci/verify-npm-assets.mjs out/verified/npm-manifest.json release-plan.json
          else cp out/verified/manifest.json out/verified/npm-manifest.json; fi
          node own/ci/artifact-record.mjs out/verified/npm-manifest.json release-plan.json own/artifacts/current.json out/bound-manifest.json
          cp out/bound-manifest.json own/release.json
          node own/ci/check-binding-package.mjs release-plan.json out/bound-manifest.json
          node -e "const fs=require('fs'),f='own/package.json',p=JSON.parse(fs.readFileSync(f));p.ownDesktopManifest=JSON.parse(fs.readFileSync('own/release.json'));fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          if [ "$BUILD_NATIVE" = true ]; then
            node own/ci/publish-artifact-record.mjs out/verified "$OWN_VERSION"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add own/release.json own/package.json
          git diff --cached --quiet || git commit -m 'chore: bind verified immutable components'
          git push origin HEAD:own-main
      - name: Publish manager through npm Trusted Publishing
        working-directory: own
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', RELEASE_VERSION: '${{ needs.prepare.outputs.version }}', RELEASE_TAG: '${{ inputs.tag }}'}
        run: npx --yes --package @petercjl/npm-release-kit npm-release-kit ci publish --release "$RELEASE_VERSION" --tag "$RELEASE_TAG"
      - name: Verify registry and persist release binding
        env: {GH_TOKEN: '${{ github.token }}', OWN_VERSION: '${{ needs.prepare.outputs.version }}', RELEASE_TAG: '${{ inputs.tag }}', BUILD_NATIVE: '${{ needs.prepare.outputs.native }}'}
        run: |
          node own/ci/verify-registry.mjs "$OWN_VERSION" "$RELEASE_TAG"
          node own/ci/persist-release.mjs release-plan.json
          git add own/artifacts/current.json
          git diff --cached --quiet || git commit -m 'chore: record published component provenance'
          git push origin HEAD:own-main
          if [ "$BUILD_NATIVE" = true ]; then gh release edit "own-v$OWN_VERSION" --draft=false --notes 'Immutable desktop artifacts; npm manager binding verified.'; fi
  audit:
    if: always()
    needs: [prepare, manager-qa, native, runtimes, recover-qa, publish]
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '24.15.0', package-manager-cache: false}
      - name: Record actual component QA packaging transfer and publication timings
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node own/ci/timings.mjs "${{ github.run_id }}" release-timings.json
      - uses: actions/upload-artifact@v7
        with: {name: release-timings, path: release-timings.json, retention-days: 30}
