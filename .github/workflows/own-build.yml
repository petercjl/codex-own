name: codex-own candidate verification
on:
  workflow_dispatch:
    inputs:
      ref: {type: string, required: true, description: 'Isolated test branch or commit'}
      version: {type: string, required: true, default: '0.0.1', description: 'Local artifact identity; no publication'}
      upstream: {type: string, required: false, default: ''}
      existing: {type: boolean, required: false, default: false}
      base_version: {type: string, required: false, default: ''}
      runtime_qa: {type: boolean, required: false, default: false}
  workflow_call:
    inputs:
      ref: {type: string, required: true}
      version: {type: string, required: true}
      upstream: {type: string, required: false, default: ''}
      existing: {type: boolean, required: false, default: false}
      base_version: {type: string, required: false, default: ''}
      runtime_qa: {type: boolean, required: false, default: true}
permissions:
  contents: read
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: darwin-arm64}
          - {os: windows-latest, platform: win32-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ inputs.ref }}', fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '24.15.0', package-manager-cache: false}
      - run: npm ci --prefix own
      - run: npm run check --prefix own && npm test --prefix own
      - name: Verify independent Node npm Python on target OS
        if: inputs.runtime_qa
        run: |
          mkdir -p out/runtime-qa
          node own/ci/prepare-runtimes.mjs out/runtime-qa "${{ matrix.platform }}" own/artifacts/current.json
          node own/ci/test-runtimes.mjs out/runtime-qa
      - name: Build updated upstream candidate
        if: ${{ !inputs.existing }}
        env:
          OWN_VERSION: ${{ inputs.version }}
          OWN_UPSTREAM_SHA: ${{ inputs.upstream }}
        run: |
          npm ci
          node --test scripts/test/*.test.mjs
          if [ "$RUNNER_OS" = macOS ]; then brew install sevenzip; else cp '/c/Program Files/7-Zip/7z.exe' '/c/Program Files/7-Zip/7zz.exe'; printf '%s\n' 'C:\Program Files\7-Zip' >> "$GITHUB_PATH"; fi
      - if: ${{ !inputs.existing }}
        env:
          OWN_VERSION: ${{ inputs.version }}
          OWN_UPSTREAM_SHA: ${{ inputs.upstream }}
        run: node own/build.mjs
      - name: Verify Windows candidate installation
        if: ${{ !inputs.existing && matrix.platform == 'win32-x64' }}
        env:
          OWN_VERSION: ${{ inputs.version }}
        run: node own/ci/test-windows-install.mjs "out/own-release-$OWN_VERSION-win32-x64.noindex/codex-own-win32-x64.tar.gz" "out/own-release-$OWN_VERSION-win32-x64.noindex/manifest-win32-x64.json"
      - name: Verify offline model turn and native archived deletion
        if: ${{ !inputs.existing }}
        env:
          OWN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then APP="out/own-release-$OWN_VERSION-darwin-arm64.noindex/built/codex-own.app"; else APP="out/own-release-$OWN_VERSION-win32-x64.noindex/built/app"; fi
          node own/ci/test-official-compat.mjs "$APP"
      - name: Verify prepared desktop artifacts
        if: ${{ inputs.existing }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWN_VERSION: ${{ inputs.version }}
          OWN_PLATFORM: ${{ matrix.platform }}
          OWN_BASE_VERSION: ${{ inputs.base_version }}
        run: node own/ci/verify-existing.mjs
      - name: Verify canonical archive and local incremental reuse
        env:
          OWN_VERSION: ${{ inputs.version }}
          OWN_PLATFORM: ${{ matrix.platform }}
        run: node own/ci/test-incremental.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: own-${{ matrix.platform }}
          path: |
            out/own-release-*/codex-own-*.tar.gz
            out/own-release-*/codex-own-*.tar
            out/own-release-*/manifest-*.json
          if-no-files-found: error
          retention-days: 3
      - name: Record source-pinned component QA proof
        run: node own/ci/qa-proof.mjs "${{ matrix.platform }}" "qa-proof-${{ matrix.platform }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: proof-${{ matrix.platform }}
          path: qa-proof-${{ matrix.platform }}.json
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: inputs.runtime_qa
        with:
          name: tools-${{ matrix.platform }}
          path: out/runtime-qa/publish/*
          retention-days: 3
          if-no-files-found: error
