name: codex-own full first installers
on:
  workflow_dispatch:
    inputs:
      version: {description: 'Exact public npm manager version, or latest', type: string, default: latest, required: true}
      publish: {description: 'Publish the verified Windows full installer', type: boolean, default: true}
      verified_run: {description: 'Recover publication from an exact run with successful Windows installer QA', type: string, required: false}
  workflow_run:
    workflows: ['Publish codex-own npm']
    types: [completed]
    branches: [own-main]
permissions: {contents: read, actions: read}
concurrency:
  group: codex-own-full-installers
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'petercjl/codex-own' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_run: ${{ steps.source.outputs.source_run }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      reuse: ${{ steps.source.outputs.reuse }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '24.15.0', package-manager-cache: false}
      - id: version
        env: {REQUESTED: '${{ inputs.version || ''latest'' }}', VERIFIED_RUN: '${{ inputs.verified_run }}'}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const requested=process.env.REQUESTED;
          if(process.env.VERIFIED_RUN&&requested==='latest')throw Error('Recovery requires an exact version');
          if(requested!=='latest'&&!/^\d+\.\d+\.\d+$/.test(requested))throw Error('Exact stable release required');
          const r=await fetch('https://registry.npmjs.org/@petercjl%2fcodex-own/'+requested);if(!r.ok)throw Error('Public npm version missing');
          const p=await r.json();if(p.name!=='@petercjl/codex-own'||!/^\d+\.\d+\.\d+$/.test(p.version)||p.ownDesktopManifest?.binding?.managerVersion!==p.version)throw Error('Release binding invalid');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+p.version+'\n');
          JS
      - id: source
        env: {GH_TOKEN: '${{ github.token }}', VERIFIED_RUN: '${{ inputs.verified_run }}'}
        run: node own/installers/recovery.mjs
  build:
    needs: prepare
    if: needs.prepare.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win32-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '24.15.0', package-manager-cache: false}
      - run: npm ci --prefix own --no-audit --no-fund
      - run: node --test own/test/first-installers.test.mjs
      - name: Install and verify NSIS build dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis --yes --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          & $nsis /VERSION
      - name: Build full installer from exact published components
        run: node own/installers/build.mjs '${{ needs.prepare.outputs.version }}' 'out/first-installer-${{ matrix.platform }}'
      - name: Verify offline first install repeat install and npm update adoption
        run: node own/installers/test-native.mjs 'out/first-installer-${{ matrix.platform }}' '${{ needs.prepare.outputs.version }}'
      - uses: actions/upload-artifact@v7
        with:
          name: first-installer-${{ matrix.platform }}
          path: out/first-installer-${{ matrix.platform }}/*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
  publish:
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.prepare.outputs.reuse == 'true') && github.ref == 'refs/heads/own-main' && (github.event_name == 'workflow_run' || inputs.publish)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v6
        with: {node-version: '24.15.0', package-manager-cache: false}
      - uses: actions/download-artifact@v7
        with:
          name: first-installer-win32-x64
          path: out/first-installers/first-installer-win32-x64
          run-id: ${{ needs.prepare.outputs.source_run }}
          github-token: ${{ github.token }}
      - name: Publish the verified immutable Windows first-install package
        env: {GH_TOKEN: '${{ github.token }}', OWN_INSTALLER_VERSION: '${{ needs.prepare.outputs.version }}', OWN_INSTALLER_SOURCE_RUN: '${{ needs.prepare.outputs.source_run }}', OWN_INSTALLER_SOURCE_REF: '${{ needs.prepare.outputs.source_ref }}'}
        run: node own/installers/publish.mjs out/first-installers
