name: codex-own-access
services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: codex_own
      POSTGRES_USER: codex_own
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_own -d codex_own"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://codex_own:${POSTGRES_PASSWORD}@db:5432/codex_own
      CODEX_OWN_ENABLED: "true"
      CODEX_OWN_PUBLIC_URL: ${CODEX_OWN_PUBLIC_URL:?required}
      CODEX_OWN_MODELS_FILE: /run/codex-own/models.json
      COMPANY_APPLICATIONS_FILE: /run/codex-own/applications.json
      CODEX_OWN_IMAGE_BINDINGS_FILE: /run/codex-own/images.json
      AUTH_MODE: dingtalk
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:?required}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:?required}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:?required}
      DINGTALK_ADMIN_UNION_ID: ${DINGTALK_ADMIN_UNION_ID:?required}
    volumes: ["${CODEX_OWN_MODELS_PATH:?required}:/run/codex-own/models.json:ro", "${COMPANY_APPLICATIONS_PATH:?required}:/run/codex-own/applications.json:ro", "${CODEX_OWN_IMAGE_BINDINGS_PATH:?required}:/run/codex-own/images.json:ro"]
    networks:
      private:
      edge:
        aliases: [codex-own-service]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
networks:
  private: {internal: true}
  edge: {external: true, name: "${CODEX_OWN_EDGE_NETWORK:?required}"}
volumes:
  database:
